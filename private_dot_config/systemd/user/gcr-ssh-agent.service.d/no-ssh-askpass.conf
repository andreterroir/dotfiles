[Service]
# ssh-agent has no terminal, so OpenSSH shows its "Confirm user presence"
# notice through $SSH_ASKPASS; gnome-ssh-askpass grabs the keyboard, which
# makes GNOME ask to allow shortcut inhibition on every YubiKey touch.
# Empty disables the notice: the YubiKey's blink is the prompt.
Environment=SSH_ASKPASS=
