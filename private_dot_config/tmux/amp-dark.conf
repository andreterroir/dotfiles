set -g @amp-theme-appearance 'dark'
# Re-apply the theme so the new appearance takes effect on OS appearance change
run '~/.tmux/plugins/tmux-amp-theme/amp-theme.tmux'
set -g window-status-current-style 'fg=orange,bold'
set -g status-right-length 60
set -g status-right "#[bg=#161616,fg=#B8AFA0] #{b:pane_current_path} #[bg=#E7894C,fg=#0F0F0F,bold] %H:%M %a %d %b "
