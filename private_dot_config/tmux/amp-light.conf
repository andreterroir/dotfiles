set -g @amp-theme-appearance 'light'
# Re-apply the theme so the new appearance takes effect on OS appearance change
run '~/.tmux/plugins/tmux-amp-theme/amp-theme.tmux'
set -g window-status-current-style 'fg=blue,bold'
set -g status-right-length 60
set -g status-right "#[bg=#FFFFFF,fg=#5A5A5A] #{b:pane_current_path} #[bg=#D9634F,fg=#F8F8F8,bold] %H:%M %a %d %b "
